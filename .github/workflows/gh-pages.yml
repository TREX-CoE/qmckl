name: github pages

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@e2f20e631ae6d7dd3b768f56a5d2af784dd54791

      - name: install emacs
        run: sudo apt-get update && sudo apt-get install -y emacs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install site dependencies
        run: python3 -m pip install --quiet -r site/tools/requirements.txt

      - name: build site
        run: bash site/tools/build.sh "$(pwd)" "$(pwd)/site-out"

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@3dbacc7e69578703f91f077118b3475862cb09b8
        with:
           branch: gh-pages
           folder: ./site-out
